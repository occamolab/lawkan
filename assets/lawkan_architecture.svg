<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 68 1000 232" width="1000" height="232" role="img" aria-label="LawKAN recipe: a chart turns the input into a group element; the edge is the learned part and maps it into the Lie algebra where the exponential is global, or emits the group element directly for GL+(2,R); the node applies the exact group product (with exp where global), optionally deformed by a zero-initialized learned correction psi. One recipe for compact and non-compact groups.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="90" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#6b7280">INPUT</text>
  <text x="290" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#6b7280">EDGE (learned)</text>
  <text x="480" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#6b7280">LIE ALGEBRA</text>
  <text x="675" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#6b7280">NODE (exact)</text>
  <text x="880" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#6b7280">GROUP</text>

  <rect x="20" y="110" width="140" height="90" rx="8" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/>
  <text x="90" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a">chart x</text>
  <text x="90" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4b5563">input</text>

  <rect x="200" y="110" width="180" height="90" rx="8" fill="#f4f5f7" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="290" y="143" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a">edge</text>
  <text x="290" y="163" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4b5563">features F(x)</text>
  <text x="290" y="181" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4b5563">carries the analytic support</text>

  <rect x="420" y="110" width="120" height="90" rx="8" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/>
  <text x="480" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a">&#958; &#8712; g</text>
  <text x="480" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4b5563">increment</text>

  <rect x="580" y="110" width="190" height="90" rx="8" fill="#e9f0fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="675" y="143" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a">node</text>
  <text x="675" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4b5563">exp, then group product</text>
  <text x="675" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4b5563">exact law: no parameters</text>

  <line x1="675" y1="200" x2="675" y2="209" stroke="#9aa0a8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="586" y="210" width="178" height="26" rx="6" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="675" y="227" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563">&#968;: optional, 0-init., learned</text>

  <rect x="810" y="110" width="140" height="90" rx="8" fill="#ffffff" stroke="#9aa0a8" stroke-width="1.5"/>
  <text x="880" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a">g &#8712; G</text>
  <text x="880" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4b5563">action on a probe</text>

  <line x1="160" y1="155" x2="198" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="155" x2="418" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="155" x2="578" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="155" x2="808" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="500" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280">One recipe for compact and non-compact groups: the node is the exact group law, optionally deformed by a zero-init. learned correction &#968;; only the edge and &#968; are learned.</text>
  <text x="500" y="274" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280">SU(2): Fourier in axis phases   &#183;   GL&#8314;(2,&#8477;): Iwasawa support   &#183;   SE(3): a, p, a&#215;p, a(a&#183;p)</text>
  <text x="500" y="291" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280">GL&#8314;(2,&#8477;) has no global exp: the edge emits the group element directly; the node still composes by the exact law.</text>
</svg>
