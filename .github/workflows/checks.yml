name: checks

on:
  push:
  pull_request:

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install light deps
        run: pip install numpy scipy
      - name: python syntax
        run: python -m compileall -q experiments repro tools
      - name: canonical dump manifest
        run: python repro/check_canonical.py
      - name: paper numbers vs canonical dumps
        run: python repro/check_numbers.py
      - name: derived statistics (Table 3 CI, X61 T1/T2, BH)
        run: python repro/stats/check_derived.py
      - name: CPU reference headline gate
        run: python repro/check_cpu_reference.py
